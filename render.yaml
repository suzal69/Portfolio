services:
  - type: web
    name: my-laravel-app
    env: php
    plan: free
    buildCommand: |
      composer install --no-interaction --prefer-dist --no-progress
      php artisan migrate --force
      php artisan storage:link
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: my-laravel-db
          property: connectionString
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database

databases:
  - name: my-laravel-db
    databaseName: mylaravel
    user: mylaravel
    plan: free
